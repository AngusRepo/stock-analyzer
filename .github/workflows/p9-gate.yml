name: P9 Gate

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  p9-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-controller/requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement ml-controller/requirements-test.txt

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run P9 gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/p9_gate.ps1 -SkipBugHunter

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Audit Python dependency manifests
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --requirement ml-controller/requirements.txt
          python -m pip_audit --strict --requirement ml-controller/requirements-execution-gateway.txt
          python -m pip_audit --strict --requirement shioaji-proxy/requirements.txt
          python -m pip install --requirement ml-service/requirements.txt
          python -m pip install --no-deps --requirement ml-service/requirements-neuralforecast.txt
          python -m pip_audit --strict --local

      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --package-lock-only --audit-level=high

      - name: Audit Frontend dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  container-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build controller production image with SBOM and provenance
        run: docker buildx build --tag stockvision-ml-controller:${{ github.sha }} --sbom=true --provenance=mode=max --load .

      - name: Build ML service production image with SBOM and provenance
        run: docker buildx build --file ml-service/Dockerfile --tag stockvision-ml-service:${{ github.sha }} --sbom=true --provenance=mode=max --load ml-service

      - name: Build execution gateway production image with SBOM and provenance
        run: docker buildx build --file Dockerfile.execution-gateway --tag stockvision-execution-gateway:${{ github.sha }} --sbom=true --provenance=mode=max --load .

      - name: Scan controller production image for known vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false
          stockvision-ml-controller:${{ github.sha }}

      - name: Scan ML service production image for known vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false
          stockvision-ml-service:${{ github.sha }}

      - name: Scan execution gateway production image for known vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false
          stockvision-execution-gateway:${{ github.sha }}
