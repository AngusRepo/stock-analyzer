name = "stockvision-worker"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[limits]
cpu_ms = 300_000

[triggers]
crons = []

[[d1_databases]]
binding = "DB"
database_name = "stockvision-db"
database_id = "6401a5f6-5767-4fa8-a1a7-ec8d4739ac79"
migrations_dir = "migrations"

[[d1_databases]]
binding = "MARKET_DB"
database_name = "stockvision-market-db"
database_id = "067bbeb0-1247-416a-96dd-138315345319"
migrations_dir = "domain-migrations/market"

[[d1_databases]]
binding = "LEARNING_DB"
database_name = "stockvision-learning-db"
database_id = "73599848-b73b-4bac-9144-df638b877dbc"
migrations_dir = "domain-migrations/learning"

[[d1_databases]]
binding = "OPS_DB"
database_name = "stockvision-ops-db"
database_id = "d9914406-bb36-45a4-bdc4-fe565ed910d3"
migrations_dir = "domain-migrations/ops"

[[d1_databases]]
binding = "CORE_DB"
database_name = "stockvision-core-db"
database_id = "8cc0ab1f-088c-4c21-b282-bcd4c790c7da"
migrations_dir = "domain-migrations/core"

[[d1_databases]]
binding = "EXECUTION_DB"
database_name = "stockvision-execution-db"
database_id = "731b3c7e-ad14-4e0e-b38e-4de53c5a83fa"
migrations_dir = "domain-migrations/execution"

[[d1_databases]]
binding = "PAPER_DB"
database_name = "stockvision-paper-db"
database_id = "bd0a99b2-077b-4d57-8971-07ff8c7f19e1"
migrations_dir = "domain-migrations/paper"

[[d1_databases]]
binding = "RESEARCH_DB"
database_name = "stockvision-research-db"
database_id = "9332506a-ef37-43d4-9ea3-5aa70b1561d2"
migrations_dir = "domain-migrations/research"

[[kv_namespaces]]
binding = "KV"
id = "39dcebcf5b6848c98f269ef9a48dc3f8"
preview_id = "9d648bfede1246be8cdbfdafa6b7e6f4"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "stockvision-artifacts"
preview_bucket_name = "stockvision-artifacts-preview"

[[queues.producers]]
binding = "UPDATE_QUEUE"
queue = "stockvision-update-queue"

[[queues.producers]]
binding = "NEWS_QUEUE"
queue = "stockvision-news-queue"

[[queues.consumers]]
queue = "stockvision-update-queue"
max_batch_size = 4
max_batch_timeout = 10
max_retries = 2
dead_letter_queue = "stockvision-update-queue-dlq"

[[queues.consumers]]
queue = "stockvision-news-queue"
max_batch_size = 2
max_batch_timeout = 10
max_retries = 2
dead_letter_queue = "stockvision-news-queue-dlq"

[ai]
binding = "AI"
remote = true

[[workflows]]
name = "strategy-discovery-analysis"
binding = "STRATEGY_DISCOVERY_WORKFLOW"
class_name = "StrategyDiscoveryWorkflow"

[vars]
ENVIRONMENT = "production"
PAGES_ORIGIN = "https://stockvision-frontend.pages.dev"
FINLAB_L5_MARKET_DATA_ENABLED = "1"
FINLAB_L5_MARKET_DATA_ALLOW_BROKER_LOGIN = "0"
FINLAB_BACKFILL_MODAL_TRIGGER_ENABLED = "1"
FINLAB_BACKFILL_YEARS = "3"
FINLAB_BACKFILL_CANONICAL_WINDOW_DAYS = "7"
SHIOAJI_L5_PROXY_FALLBACK_ENABLED = "0"
LIVE_EXECUTION_SHADOW_CLIENT_ENABLED = "1"
LIVE_EXECUTION_SHADOW_GUARD_ENABLED = "0"
LIVE_EXECUTION_CLIENT_ENABLED = "0"
LIVE_EXECUTION_SUBMIT_GUARD_ENABLED = "0"
LIVE_EXECUTION_SHADOW_SCOPE = "paper-parity-v1"
S12_INTRADAY_ASSIST_ENABLED = "1"
S12_INTRADAY_GATE_MODE = "assist_entry"
S12_INTRADAY_PRIMARY_OWNER_ENABLED = "1"
S12_INTRADAY_KBARS_ENABLED = "1"
S12_RESEARCH_KBARS_URL = "https://shioaji-research-530028717113.asia-east1.run.app"
S12_INTRADAY_BASE_BAR_INTERVAL_MS = "60000"
S12_INTRADAY_BAR_LOOKBACK = "720"
S12_INTRADAY_MAX_CHASE_PCT_CAP = "0.012"
