name: GHCR Retention

permissions:
  contents: read
  packages: write

on:
  schedule:
    # 02:37 Asia/Taipei. Temporary CI images expire after 7 days;
    # fully-passed main candidates expire after 30 days.
    - cron: '37 18 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report eligible versions without deleting them
        required: true
        default: true
        type: boolean

concurrency:
  group: ghcr-retention
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Delete only expired temporary image versions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/cleanup_ghcr_ci_images.py \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --package stockvision-ml-controller \
            --package stockvision-ml-service \
            --package stockvision-execution-gateway \
            --max-deletes-per-package 25 \
            "${args[@]}"
