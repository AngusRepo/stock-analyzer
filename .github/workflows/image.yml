name: controller image

# Build the root Dockerfile from scratch: no push, no secrets. The build runs the image's own
# checks (Worker compile, native bundle, native_execution_identity == the committed
# native_execution_behavior_release.json, FinLab/Arrow import). Production images are still
# overlays on the live image; this shows whether the commit also builds without that chain
# (CD prerequisite E-3) and records the Python packages a fresh build resolves.
on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'ml-controller/**'
      - 'worker/**'
      - 'schemas/**'
      - 'infra/**'
      - 'data/**'
      - 'tools/**'
      - 'output/feature_universe_triage/**'
      - 'ci/check_constraints.py'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Layer cache in the Actions cache: the pip and npm layers change only with their lockfiles.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: stockvision-controller:ci
          # A commit awaiting its re-pin still builds through every later step; the ci gate and
          # the native-identity check own that verdict. Production builds assert (Dockerfile).
          build-args: NATIVE_IDENTITY_ASSERT=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Native identity in the image (informational)
        run: |
          set -e
          # the image's own identity next to the committed pin; a mismatch is a warning here
          actual="$(docker run --rm --entrypoint python stockvision-controller:ci -c 'from services.native_paper_sandbox import native_execution_identity; print(native_execution_identity())')"
          declared="$(jq -r .execution_owner_version ml-controller/services/native_execution_behavior_release.json)"
          echo "actual $actual, declared $declared"
          [ "$actual" = "$declared" ] || echo "::warning title=native identity::image identity $actual differs from the pin $declared (re-pin needed; production builds refuse it)"
      - name: Resolved Python packages
        run: |
          set -e
          # what an unpinned requirement or transitive dependency resolved to in this build
          docker run --rm --entrypoint pip stockvision-controller:ci freeze --all | sort > "$RUNNER_TEMP/pip-freeze.txt"
          wc -l "$RUNNER_TEMP/pip-freeze.txt"
      - name: Packages match constraints.txt
        run: python ci/check_constraints.py ml-controller/constraints.txt "$RUNNER_TEMP/pip-freeze.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: controller-image-pip-freeze
          path: ${{ runner.temp }}/pip-freeze.txt
