name: P9 Gate

on:
  workflow_dispatch:
  # Windows re-run of the worker/controller/frontend checks: PRs that touch none of them or
  # what they read (docs, CI tooling, audits) skip it. Not a required check, so a skipped run
  # blocks nothing.
  pull_request:
    paths:
      - 'worker/**'
      - 'ml-controller/**'
      - 'ml-service/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'infra/**'
      - 'schemas/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/p9-gate.yml'
  push:
    branches:
      - main
      - feature/**

# A newer push to the same PR supersedes the 25-minute Windows run. Pushes to main and
# feature branches queue instead, so every merged sha keeps its own P9 result.
concurrency:
  group: p9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  p9-gate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Same minor as the controller image (Dockerfile: Python 3.11.17).
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ml-controller/requirements.txt
            ml-controller/constraints.txt

      # constraints.txt pins the live image's packages, as in the Dockerfile and ci/controller_deps.sh.
      - name: Install controller test dependencies
        shell: powershell
        run: |
          python -m venv ml-controller/.venv
          ml-controller/.venv/Scripts/python.exe -m pip install -r ml-controller/requirements.txt -c ml-controller/constraints.txt pytest==9.0.3 pytest-asyncio==1.4.0

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run P9 gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/p9_gate.ps1 -SkipBugHunter
