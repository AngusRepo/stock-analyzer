name: P9 Gate

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  p9-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-controller/requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install --requirement ml-controller/requirements-test.txt

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run P9 gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/p9_gate.ps1 -SkipBugHunter

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Audit Python dependency manifests
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --strict --requirement ml-controller/requirements.txt
          python -m pip_audit --strict --requirement ml-controller/requirements-execution-gateway.txt
          python -m pip_audit --strict --requirement shioaji-proxy/requirements.txt
          python -m pip install --requirement ml-service/requirements.txt
          python -m pip install --no-deps --requirement ml-service/requirements-neuralforecast.txt
          python -m pip_audit --strict --local

      - name: Audit Worker dependencies
        working-directory: worker
        run: npm audit --package-lock-only --audit-level=high

      - name: Audit Frontend dependencies
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high

  container-security:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            image: stockvision-ml-controller
            context: .
            dockerfile: Dockerfile
          - component: ml-service
            image: stockvision-ml-service
            context: ml-service
            dockerfile: ml-service/Dockerfile
          - component: execution-gateway
            image: stockvision-execution-gateway
            context: .
            dockerfile: Dockerfile.execution-gateway
    env:
      DOCKER_BUILD_RECORD_RETENTION_DAYS: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve immutable image coordinates
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            retention_class="quarantine"
          else
            retention_class="ci"
          fi
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "tag=${retention_class}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ${{ matrix.component }} image with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}

      - name: Verify registry digest, SBOM, and max provenance
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{ json .SBOM }}' > sbom.json
          docker buildx imagetools inspect "$IMAGE_REF" --format '{{ json .Provenance }}' > provenance.json
          python - <<'PY'
          import json

          def select_attestation(document, kind):
              if not isinstance(document, dict):
                  raise ValueError(f"{kind} document is not an object")
              direct = document.get(kind)
              if isinstance(direct, dict):
                  return direct
              platform = document.get("linux/amd64")
              if isinstance(platform, dict) and isinstance(platform.get(kind), dict):
                  return platform[kind]
              raise ValueError(f"{kind} attestation is absent; top-level keys={sorted(document)}")

          def verify_max_provenance(provenance):
              build_type = provenance.get("buildType")
              if build_type:
                  build_config = provenance.get("buildConfig")
                  llb = build_config.get("llbDefinition") if isinstance(build_config, dict) else None
                  if not isinstance(llb, list) or not llb:
                      raise ValueError("SLSA v0.2 provenance lacks max-mode LLB definition")
                  return

              build_definition = provenance.get("buildDefinition")
              if not isinstance(build_definition, dict) or not build_definition.get("buildType"):
                  raise ValueError("provenance is neither valid SLSA v0.2 nor v1")
              internal = build_definition.get("internalParameters")
              build_config = internal.get("buildConfig") if isinstance(internal, dict) else None
              llb = build_config.get("llbDefinition") if isinstance(build_config, dict) else None
              if not isinstance(llb, list) or not llb:
                  raise ValueError("SLSA v1 provenance lacks max-mode LLB definition")

          with open("sbom.json", encoding="utf-8") as handle:
              sbom_document = json.load(handle)
          with open("provenance.json", encoding="utf-8") as handle:
              provenance_document = json.load(handle)

          try:
              sbom = select_attestation(sbom_document, "SPDX")
              provenance = select_attestation(provenance_document, "SLSA")
              if not sbom.get("packages"):
                  raise ValueError("SBOM contains no packages")
              verify_max_provenance(provenance)
          except (TypeError, ValueError) as error:
              print(f"::error title=Container attestation contract::{error}")
              raise SystemExit(1) from error
          PY

      - name: Scan immutable ${{ matrix.component }} digest for known vulnerabilities
        shell: bash
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          docker run --rm
          -e TRIVY_USERNAME
          -e TRIVY_PASSWORD
          aquasec/trivy@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed=false
          "$IMAGE_REF"

  promote-container-candidates:
    if: github.ref == 'refs/heads/main'
    needs: container-security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Promote the fully-passed OCI indexes without rebuilding
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in stockvision-ml-controller stockvision-ml-service stockvision-execution-gateway; do
            source_ref="ghcr.io/${owner}/${image}:quarantine-${GITHUB_SHA}"
            target_ref="ghcr.io/${owner}/${image}:candidate-${GITHUB_SHA}"
            docker buildx imagetools create --tag "$target_ref" "$source_ref"
          done
