name: P9 Gate

on:
  workflow_dispatch:
  # Windows re-run of the worker/controller/frontend checks: PRs that touch none of them
  # (docs, CI tooling, audits) skip it. Not a required check, so a skipped run blocks nothing.
  pull_request:
    paths:
      - 'worker/**'
      - 'ml-controller/**'
      - 'ml-service/**'
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/p9-gate.yml'
  push:
    branches:
      - main
      - feature/**

# A newer push to the same PR or branch supersedes the 25-minute Windows run.
concurrency:
  group: p9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p9-gate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-controller/requirements.txt

      - name: Install controller test dependencies
        shell: powershell
        run: |
          python -m venv ml-controller/.venv
          ml-controller/.venv/Scripts/python.exe -m pip install -r ml-controller/requirements.txt pytest==9.0.3 pytest-asyncio==1.4.0

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run P9 gate
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/p9_gate.ps1 -SkipBugHunter
