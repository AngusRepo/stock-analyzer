name: ci

# PR gate: run every suite on the PR head and on its base, then fail only on
# failures the base does not have. No secrets are used by this workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  suite:
    name: ${{ matrix.suite }} (${{ matrix.side }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
        suite: [worker, controller, frontend, hygiene]
    steps:
      - name: Resolve commit
        id: ref
        shell: bash
        run: |
          set -e
          # head = the commit under test; base = what it is compared against
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head='${{ github.event.pull_request.head.sha }}'; base='${{ github.event.pull_request.base.sha }}'
          elif [ "${{ github.event_name }}" = "push" ]; then
            head='${{ github.sha }}'; base='${{ github.event.before }}'
          else
            head='${{ github.sha }}'; base='${{ github.sha }}'
          fi
          [ "${{ matrix.side }}" = head ] && echo "sha=$head" >> "$GITHUB_OUTPUT" || echo "sha=$base" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          fetch-depth: 1

      # The comparison tooling comes from github.sha: on pull_request that is the
      # base+head merge commit, so a branch older than ci/ still gets the tools and a
      # PR that edits ci/ is tested with its own version. On push it is the commit itself.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: ci
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: matrix.suite != 'hygiene'
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # Only the controller suite installs pip packages; caching elsewhere fails the post step.
          cache: ${{ matrix.suite == 'controller' && 'pip' || '' }}
          cache-dependency-path: ml-controller/requirements.txt

      - name: Run suite
        shell: bash
        run: bash .ci-tools/ci/run_suite.sh "${{ matrix.suite }}" "$RUNNER_TEMP/failures.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-${{ matrix.suite }}-${{ matrix.side }}
          path: ${{ runner.temp }}/failures.txt
          if-no-files-found: error

  # Controller tests that fail on head but not on base are rerun twice, serially, on head.
  # Ids that pass at least once are reported as flaky by the gate instead of blocking it.
  confirm:
    name: confirm new controller failures
    needs: suite
    if: always() && needs.suite.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Code under rerun is the head; the rerun tooling comes from github.sha like the suites.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: ci
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: failures-controller-*
          path: failures
      - name: List head-only failures
        run: python .ci-tools/ci/rerun_new_failures.py list failures "$RUNNER_TEMP/new.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No pip cache here: most runs install nothing, and an unused cache fails the post step.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rerun them
        run: bash .ci-tools/ci/rerun_controller.sh "$RUNNER_TEMP/new.txt" "$RUNNER_TEMP/flaky.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: flaky-controller
          path: ${{ runner.temp }}/flaky.txt
          if-no-files-found: error

  gate:
    name: gate
    if: always()
    needs: [suite, confirm]
    runs-on: ubuntu-latest
    steps:
      # Suites exit 0 once their list is written, so any other result means a suite
      # was cancelled or timed out and its (possibly empty) list cannot be trusted.
      - name: Require every suite to finish
        run: |
          set -e
          if [ "${{ needs.suite.result }}" != success ] || [ "${{ needs.confirm.result }}" != success ]; then
            echo "suite result: ${{ needs.suite.result }}, confirm result: ${{ needs.confirm.result }}"; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        with:
          path: failures
      - name: Compare head against base
        run: python ci/compare_failures.py failures
